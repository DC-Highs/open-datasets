name: "Sync: Dragon City Game"

on:
  schedule:
    - cron: '0 5 * * *' # Every day at 05:00 UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npm run prisma:dragoncitygame:generate
        env:
          DRAGONCITYGAME_DATABASE_URL: "file:./dragoncitygame/data.sqlite3"

      - name: Run Daily Sync
        run: npm run dragoncitygame:sync
        env:
          DRAGONCITYGAME_DATABASE_URL: "file:./dragoncitygame/data.sqlite3"

      - name: Pull Latest Remote Changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git stash --include-untracked
            git pull --rebase origin master
            git stash pop
          else
            git pull --rebase origin master
          fi

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily dragoncitygame data sync [skip ci]"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          file_pattern: 'dragoncitygame/json/*.json dragoncitygame/data.sqlite3 state/dragoncitygame.state.json'
          branch: master
